[project]
name = "unicorn-chat"
version = "0.1.0"
description = "Conversational assistant over the Indian unicorn startups dataset (May 2025)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
    "anthropic>=2.0",
    "langfuse>=3.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
